<!DOCTYPE html>
<html lang="en">
<head>
<title>All Mods Keys Dream</title>
<meta charset="UTF-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:#f2f4f8; padding:16px 14px 40px; color:#1a1a2e; }

  /* ===== HEADER ===== */
  .header { text-align:center; padding:10px 0 4px; }
  .logo {
    width:60px; height:60px; margin:0 auto 8px; border-radius:18px;
    background:linear-gradient(135deg,#448aff,#7c4dff);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(68,138,255,.35);
  }
  .logo span { color:#fff; font-size:30px; }
  .header h1 { font-size:24px; font-weight:700; }
  .updated {
    display:inline-flex; align-items:center; gap:4px;
    margin-top:6px; font-size:11.5px; color:#7a869a;
    background:#e8ecf3; padding:4px 14px; border-radius:50px;
  }
  .updated span { font-size:14px; }

  /* ===== SEARCH ===== */
  .search {
    position:relative; max-width:560px; margin:16px auto 4px;
  }
  .search span { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#98a2b3; font-size:20px; }
  .search input {
    width:100%; padding:12px 14px 12px 44px; border-radius:14px;
    border:2px solid #e2e8f0; background:#fff; font-size:14px;
    outline:none; font-family:'Poppins',sans-serif;
  }
  .search input:focus { border-color:#448aff; }

  /* ===== CARDS ===== */
  .list { max-width:560px; margin:12px auto 0; display:flex; flex-direction:column; gap:10px; }
  .card {
    display:flex; align-items:center; gap:12px;
    background:#fff; border-radius:14px; padding:11px 13px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border:1px solid #eef1f6;
  }
  .card img {
    width:50px; height:50px; border-radius:12px; object-fit:cover; flex-shrink:0;
  }
  .info { flex:1; min-width:0; }
  .name-row { display:flex; align-items:center; gap:5px; }
  .name-row h2 {
    font-size:14.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .st { font-size:16px; flex-shrink:0; }
  .st.active   { color:#12b76a; }  /* ✔ green  */
  .st.updating { color:#f79009; }  /* ⏳ orange */
  .st.expired  { color:#f04438; }  /* ✖ red    */
  .key-row { display:flex; align-items:center; gap:4px; margin-top:2px; }
  .key-row span { font-size:13px; color:#98a2b3; }
  .key-row p {
    font-size:12px; color:#667085;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ===== COPY BUTTON ===== */
  .copy-btn {
    flex-shrink:0; display:flex; align-items:center; gap:4px;
    padding:9px 13px; border:none; border-radius:10px; cursor:pointer;
    background:#1677ff; color:#fff; font-family:'Poppins',sans-serif;
    font-size:12px; font-weight:600;
    transition:.15s;
  }
  .copy-btn span { font-size:15px; }
  .copy-btn:active { transform:scale(.94); }
  .copy-btn.done { background:#12b76a; }

  .empty { text-align:center; color:#98a2b3; padding:36px 0; font-size:14px; }

  /* ===== TOAST (small popup message) ===== */
  .toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px);
    display:flex; align-items:center; gap:6px;
    background:#12b76a; color:#fff; font-weight:600; font-size:13px;
    padding:11px 20px; border-radius:50px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition:.3s; z-index:99;
  }
  .toast span { font-size:17px; }
  .toast.show { transform:translateX(-50%) translateY(0); }

  .footer { text-align:center; margin-top:24px; font-size:11px; color:#98a2b3; }
</style>
</head>
<body>

  <div class="header">
    <div class="logo"><span class="material-symbols-rounded">key</span></div>
    <h1>All Mods Keys</h1>
    <div class="updated"><span class="material-symbols-rounded">schedule</span> Updated at <span id="date"></span></div>
  </div>

  <div class="search">
    <span class="material-symbols-rounded">search</span>
    <input type="text" id="searchInput" placeholder="Search game..." oninput="filterCards()">
  </div>

  <div style="max-width:560px;margin:14px auto 0;background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:Poppins,sans-serif;font-size:13px;color:#3730a3;">
  <span>VIP members get an instant key.</span>
  <a href="vipkey.html" data-vip-key style="background:#4f46e5;color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:600;">Get VIP key</a>
</div>
  <div class="list" id="list"></div>

  <div class="toast" id="toast"><span class="material-symbols-rounded">check_circle</span><span id="toastText">Key copied!</span></div>

  <div class="footer">Tap <b>Copy Key</b> to copy instantly ⭐</div>

<script>
/* ═══════════════════════════════════════════════════════
   ★★★  EDIT HERE — BEGINNER ZONE  ★★★
   ─────────────────────────────────────────────────────
   HOW TO ADD A NEW GAME:
   Copy one line below, paste it, and change the values:

   { name:'Game Name', key:'your-key-here',
     src:'https://link-to-icon.png', status:'Active' },

   STATUS OPTIONS (pick one):
   • 'Active'    → shows ✔ green check
   • 'Updating'  → shows ⏳ hourglass
   • 'Expired'   → shows ✖ red cancel

   TIP: src = icon image link. If the link breaks,
        a default icon shows automatically. 😊
   ═══════════════════════════════════════════════════════ */
const MODS = [
  { name:'Subway Surfers ',      key:'Not key method dowload enjoy ', src:'https://play-lh.googleusercontent.com/ykHUp1lJfS8xJ9SKi8xGqW2h7D0dCGK_0_77Z35yVoeRKpZn1RdLQJOP5cOHf20vvIU6=s150-rw',   status:'Active'   },
  { name:'Game changer 5 ',      key:'Soon', src:'https://image.winudf.com/v2/image1/ZGV2X2ltYWdlXzM2OTExODM2XzIyNzQwNV8yMDI1MTIyMjEwMzUzNjAzNA/icon.webp?w=360&fakeurl=1&type=.webp',   status:'Updating'   },

];

/* ─── You don't need to edit anything below this line ─── */

const STATUS_ICON = {
  'Active':   { icon:'check_circle',  cls:'active'   },
  'Updating': { icon:'hourglass_top', cls:'updating' },
  'Expired':  { icon:'cancel',        cls:'expired'  }
};
const FALLBACK = 'https://ui-avatars.com/api/?name=G&background=37474f&color=fff';

// Show today's date in the header
document.getElementById('date').textContent = new Date().toLocaleString();

function render(list) {
  const box = document.getElementById('list');
  if (!list.length) {
    box.innerHTML = '<div class="empty">No games found 😕</div>';
    return;
  }
  box.innerHTML = list.map(m => {
    const s = STATUS_ICON[m.status] || STATUS_ICON['Active'];
    return `
    <div class="card">
      <img src="${m.src}" alt="${m.name}" onerror="this.onerror=null;this.src='${FALLBACK}'">
      <div class="info">
        <div class="name-row">
          <h2>${m.name}</h2>
          <span class="material-symbols-rounded st ${s.cls}" title="${m.status}">${s.icon}</span>
        </div>
        <div class="key-row">
          <span class="material-symbols-rounded">vpn_key</span>
          <p>${m.key}</p>
        </div>
      </div>
      <button class="copy-btn" onclick="copyKey(this,'${m.key}','${m.name}')">
        <span class="material-symbols-rounded">content_copy</span> Copy Key
      </button>
    </div>`;
  }).join('');
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(MODS.filter(m => m.name.toLowerCase().includes(q)));
}

function copyKey(btn, key, name) {
  const ta = document.createElement('textarea');
  ta.value = key;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);

  btn.classList.add('done');
  btn.innerHTML = '<span class="material-symbols-rounded">check</span> Copied!';
  showToast(name + ' key copied!');
  setTimeout(() => {
    btn.classList.remove('done');
    btn.innerHTML = '<span class="material-symbols-rounded">content_copy</span> Copy Key';
  }, 1500);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

render(MODS);
</script>
<script type="module" src="vip.js"></script>
</body>
</html>
